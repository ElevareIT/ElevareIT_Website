<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <style>
    .boat { animation: drift 18s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(60px); } }
    @media (prefers-reduced-motion: reduce) { .boat { animation: none; } }
  </style>
  <defs>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc9f0"/>
      <stop offset="1" stop-color="#7fb4e6"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f86d6"/>
      <stop offset="1" stop-color="#2a68b8"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8fd8"/>
      <stop offset="1" stop-color="#36b3f0"/>
    </linearGradient>
  </defs>
