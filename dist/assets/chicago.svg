<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">Chicago, looking ahead</title><desc id="desc">An original architectural illustration of the Chicago skyline and river in soft evening light, with tiered towers, waterfront buildings, bridges, and reflections.</desc>
